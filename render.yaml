services:
  - type: web
    name: world-design-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: world-design-backend.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://world-design-frontend.onrender.com,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://world-design-backend.onrender.com,https://world-design-frontend.onrender.com,http://localhost:5173
      - key: CLOUDINARY_CLOUD_NAME
        value: your-cloudinary-cloud-name
      - key: CLOUDINARY_API_KEY
        value: your-cloudinary-api-key
      - key: CLOUDINARY_API_SECRET
        value: your-cloudinary-api-secret
      - key: DB_ENGINE
        value: postgres
      - key: DB_NAME
        value: world_design
      - key: DB_USER
        value: world_design
      - key: DB_PASSWORD
        generateValue: true
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 5432
      - key: SITE_URL
        value: https://world-design-backend.onrender.com
      - key: CINETPAY_RETURN_URL
        value: https://world-design-frontend.onrender.com/order-success

  - type: static
    name: world-design-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://world-design-backend.onrender.com/api
